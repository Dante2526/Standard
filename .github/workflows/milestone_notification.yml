name: Disparo de E-mail de Marco (Milestone)
on:
  repository_dispatch:
    types: [milestone_reached]
  workflow_dispatch:
    inputs:
      name:
        description: 'Nome do Colaborador'
        required: true
      matricula:
        description: 'Matrícula'
        required: true
      milestoneHours:
        description: 'Horas do Marco'
        required: true

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        # Padrão Ouro: dados externos isolados em variáveis de ambiente
        # Isso evita injeção de comandos caso os dados venham de fontes não confiáveis
        env:
          TRAINEE_NAME: ${{ github.event.client_payload.name || github.event.inputs.name }}
          TRAINEE_MATRICULA: ${{ github.event.client_payload.matricula || github.event.inputs.matricula }}
          TRAINEE_MILESTONE: ${{ github.event.client_payload.milestoneHours || github.event.inputs.milestoneHours }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: 'Pré-avaliação solicitada: ${{ env.TRAINEE_NAME }}'
          to: ${{ secrets.EMAIL_TO }}
          from: Standard <${{ secrets.EMAIL_USER }}>
          body: |
            Olá,

            O colaborador atingiu um novo marco em sua jornada de treinamento e precisa de uma pré-avaliação na plataforma.

            Dados do Colaborador:
            - Nome: ${{ env.TRAINEE_NAME }}
            - Matrícula: ${{ env.TRAINEE_MATRICULA }}
            - Marco Atingido: ${{ env.TRAINEE_MILESTONE }} horas

            Por favor, acesse o sistema Standard para registrar a avaliação deste marco.
