name: Disparo de E-mail de Marco (Milestone)
on:
  repository_dispatch:
    types: [milestone_reached]
  workflow_dispatch:
    inputs:
      name:
        description: 'Nome do Colaborador'
        required: true
      matricula:
        description: 'Matrícula'
        required: true
      milestoneHours:
        description: 'Horas do Marco'
        required: true

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          # Required: SMTP server address
          server_address: ${{ secrets.SMTP_SERVER }}
          # Required: SMTP server port
          server_port: ${{ secrets.SMTP_PORT }}
          # Optional: (default: false)
          secure: true
          # Required: username for SMTP authentication
          username: ${{ secrets.EMAIL_USER }}
          # Required: password for SMTP authentication
          password: ${{ secrets.EMAIL_PASS }}
          # Required: email subject
          subject: 'Pré-avaliação solicitada: ${{ github.event.client_payload.name || github.event.inputs.name }}'
          # Required: recipient(s) address
          to: ${{ secrets.EMAIL_TO }}
          # Required: sender address
          from: Standard System <${{ secrets.EMAIL_USER }}>
          # Optional: body string
          body: |
            Olá,

            O colaborador atingiu um novo marco em sua jornada de treinamento e precisa de uma pré-avaliação na plataforma.

            Dados do Colaborador:
            - Nome: ${{ github.event.client_payload.name || github.event.inputs.name }}
            - Matrícula: ${{ github.event.client_payload.matricula || github.event.inputs.matricula }}
            - Marco Atingido: ${{ github.event.client_payload.milestoneHours || github.event.inputs.milestoneHours }} horas

            Por favor, acesse o sistema Standard para registrar a avaliação deste marco.
